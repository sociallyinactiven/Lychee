<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mylora | Premium External</title>

    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.work.ink/js/redirect.js?id=2814" data-url="https://work.ink/direct/2814" data-max="3"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        purple: {
                            400: '#a855f7',
                            500: '#a855f7',
                            600: '#9333ea',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            background-color: #09090b;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            color: #fafafa;
        }
        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .browser-window {
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(39, 39, 42, 1);
        }
        [x-cloak] { display: none !important; }
    </style>
</head>

<body x-data="app()" x-init="init()">
    <div id="vanta-bg"></div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex flex-col px-6 pt-16 pb-20">
        <div class="w-full max-w-6xl mx-auto mt-8 mb-20 browser-window rounded-xl shadow-2xl overflow-hidden flex flex-col min-h-[600px]">

            <!-- Header -->
            <div class="bg-[#0c0c0e]/90 border-b border-zinc-800 px-4 pt-3 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="flex gap-2 mr-4">
                        <div class="w-3 h-3 rounded-full bg-zinc-800"></div>
                        <div class="w-3 h-3 rounded-full bg-zinc-800"></div>
                        <div class="w-3 h-3 rounded-full bg-zinc-800"></div>
                    </div>
                    <button class="flex items-center gap-2 px-4 py-2 text-sm font-medium bg-[#18181b] text-purple-400 rounded-t-lg border">
                        <i data-lucide="house" class="w-3.5 h-3.5"></i>
                        Home
                    </button>
                </div>

                <a href="https://discord.gg/fmAkWcaTTM" target="_blank"
                   class="flex items-center gap-2 bg-purple-500/10 hover:bg-purple-500/20 text-purple-400 px-3 py-1.5 rounded-md text-xs font-semibold border border-purple-500/20">
                    <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                    Join Community
                </a>
            </div>

            <!-- Content -->
            <div class="p-8 text-center">
                <img src="https://i.postimg.cc/yYQJtLJX/Mylora-Logo.png" class="w-24 mx-auto mb-6">
                <h2 class="text-4xl font-bold">
                    Mylora External <br>
                    <span class="text-purple-400">FREE legit cheat for roblox</span>
                </h2>

                <div class="mt-8 flex justify-center gap-4">
                    <button @click="openDownload()" class="px-10 py-4 bg-purple-600 rounded-xl font-bold">
                        Download
                    </button>

                    <a href="https://discord.gg/fmAkWcaTTM" target="_blank"
                       class="px-10 py-4 bg-zinc-900 border border-zinc-800 rounded-xl">
                        Discord
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                modals: { warning: false },

                init() {
                    lucide.createIcons();

                    if (window.VANTA) {
                        window.VANTA.NET({
                            el: "#vanta-bg",
                            color: 0xa855f7,
                            backgroundColor: 0x09090b
                        });
                    }
                },

                openDownload() {
                    window.open("https://work.ink/1RAs/e0b1f750-4f95-47d6-91f2-c7f73eb51f87", "_blank");
                }
            }
        }
    </script>
</body>
</html>
